# Render Blueprint. In the Render dashboard: New → Blueprint → pick this repo,
# and everything below is created for you. The two values marked `sync: false`
# are the ones you paste in by hand.
#
# The database deliberately lives on Neon, not Render: Render's free Postgres
# is deleted 30 days after it is created.
services:
  - type: web
    name: asset-management-api
    runtime: node
    plan: free
    # Closest free region to India. Oregon and Frankfurt also offer a free plan.
    region: singapore
    branch: main
    healthCheckPath: /api/v1/health

    # pnpm needs enabling, the shared package must be built before the API that
    # imports it, and Prisma's client is generated from the schema at build time.
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm --filter @asset/shared build
      pnpm --filter @asset/api db:generate
      pnpm --filter @asset/api build

    # Migrations run before the server binds, so a schema change always ships
    # with the code that depends on it.
    startCommand: pnpm --filter @asset/api db:migrate:deploy && node apps/api/dist/main.js

    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: NODE_ENV
        value: production

      # Paste your Neon pooled connection string here (ends in ?sslmode=require).
      - key: DATABASE_URL
        sync: false

      # Your Vercel URL. `*.vercel.app` additionally allows preview deploys.
      - key: CORS_ORIGINS
        sync: false

      # Render generates two different random secrets on first deploy.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: LOG_LEVEL
        value: info
      - key: LOG_PRETTY
        value: "false"
